<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ShopFlow – Home</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <main class="container" id="app">
      <section class="hero">
        <h1>Everyday things, picked well.</h1>
        <p>
          Clothing, jewelry and electronics from one small store. Free shipping
          over $100.
        </p>
        <a class="btn" href="products.html">Shop all products</a>
      </section>
      <div class="chips" id="cats"></div>
      <div class="head">
        <h2>Top rated</h2>
        <a href="products.html">See all</a>
      </div>
      <div class="grid" id="featured"></div>
      <section class="perks">
        <div><b>Free shipping</b><span>On orders over $100</span></div>
        <div><b>Saved favorites</b><span>Kept on this device</span></div>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
